[tool.poetry]
name = "1ne-backend"
version = "0.1.0"
description = "Backend API for 1ne.ai - AI-powered teacher assistant"
authors = ["1ne.ai Team"]
readme = "README.md"
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlalchemy = "^2.0.23"
alembic = "^1.12.1"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
psycopg2-binary = "^2.9.9"
requests = "^2.31.0"
python-multipart = "^0.0.6"
openai = "^1.3.0"
anthropic = "^0.18.0"
google-generativeai = "^0.3.0"
redis = "^5.0.0"
youtube-transcript-api = "^0.6.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

